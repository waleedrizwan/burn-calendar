[project]
name = "burn-calendar"
version = "0.1.0"
description = "Harmonized Burning Activity Calendar from NASA FIRMS MODIS and VIIRS hotspots"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
